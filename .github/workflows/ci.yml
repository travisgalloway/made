name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'macos/**'
      - '.github/workflows/ci.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and test
    runs-on: macos-26
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Shaders compile at build time, and Xcode 26 ships the Metal compiler as a separate component.
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: spm-v6-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: |
            spm-v6-${{ runner.os }}-

      # Swift Build compiles Shaders.metal into default.metallib; the native build system only copies it.
      - name: Build
        run: swift build --build-system swiftbuild --build-tests

      - name: Test
        run: swift test --build-system swiftbuild --skip-build
