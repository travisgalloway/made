name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'macos/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.githooks/**'
      - 'img/made.icon/**'
      - 'Makefile'
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'macos/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.githooks/**'
      - 'img/made.icon/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Swift build and test
    runs-on: macos-26
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache selective testing tool
        uses: actions/cache@v5
        with:
          path: ~/.cache/made-ci/xcode-selective-test
          key: xst-v1-${{ runner.os }}-${{ hashFiles('macos/scripts/test-affected.sh') }}
          restore-keys: |
            xst-v1-${{ runner.os }}-

      - name: Resolve affected unit tests
        id: affected
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          macos/scripts/test-affected.sh \
            --ci \
            --base-branch "origin/${{ github.base_ref || 'main' }}" \
            --mode plan

      - name: Set up Swift and build caches
        if: steps.affected.outputs.affected_unit == 'true'
        uses: ./.github/actions/setup-swift
        with:
          cache-scope: swift

      # Swift Build compiles Shaders.metal into default.metallib; the native build system only copies it.
      - name: Build
        if: steps.affected.outputs.affected_unit == 'true'
        run: swift build --build-system swiftbuild --build-tests

      - name: Test (Selective on PR, Full on main/merge_group/fail-open)
        if: steps.affected.outputs.affected_unit == 'true'
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          macos/scripts/test-affected.sh \
            --ci \
            --skip-build \
            --base-branch "origin/${{ github.base_ref || 'main' }}" \
            --mode unit

  ui-tests:
    name: Panel UI tests
    runs-on: macos-26
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache selective testing tool
        uses: actions/cache@v5
        with:
          path: ~/.cache/made-ci/xcode-selective-test
          key: xst-v1-${{ runner.os }}-${{ hashFiles('macos/scripts/test-affected.sh') }}
          restore-keys: |
            xst-v1-${{ runner.os }}-

      - name: Resolve affected UI tests
        id: affected
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          macos/scripts/test-affected.sh \
            --ci \
            --base-branch "origin/${{ github.base_ref || 'main' }}" \
            --mode plan

      - name: Set up Swift and build caches
        if: steps.affected.outputs.affected_ui == 'true'
        uses: ./.github/actions/setup-swift
        with:
          cache-scope: ui

      - name: Run panel UI tests
        if: steps.affected.outputs.affected_ui == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          macos/scripts/test-affected.sh \
            --ci \
            --base-branch "origin/${{ github.base_ref || 'main' }}" \
            --mode ui
